# RAM cost: 12
QuickHack.VH_HackSpreadHack_inline1:
  $type: gamedataStatPoolCost_Record
  statPool: BaseStatPools.Memory
  costMods:
    - QuickHack.MemoryCostReductionMod
    - QuickHack.ConsumableCostReduction
    - QuickHack.TargetResistanceControl
    - QuickHack.VH_HackSpreadHack_inline2

QuickHack.VH_HackSpreadHack_inline2:
  $type: gamedataConstantStatModifier_Record
  value: 12
  modifierType: Additive
  statType: BaseStats.Memory

# The spreading itself runs in the script on upload completion, so there is
# deliberately no status effect here.

