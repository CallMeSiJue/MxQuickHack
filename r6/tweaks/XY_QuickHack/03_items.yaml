# =============================================================================
#  VH Quickhacks - items
# =============================================================================
#  Prices are NOT overridden: inheriting Items.CovertHack gives exactly the same
#  price composition vanilla legendary covert programs use
#  (Price.BaseHackPrice + Price.ItemQualityMultiplier +
#    Price.BuyPrice_StreetCred_Discount + Price.CovertHackMultiplier).
#
#  shardType is deliberately SHARED across the three Self-Erase tiers, exactly
#  like vanilla Memory Wipe (shardType "MemoryWipe" on Lvl2/Lvl3/Lvl4):
#  ItemModificationSystem.RemoveOtherShards uninstalls other programs with the
#  same shardType, so only one tier of the same hack can sit in the deck at a
#  time. Hack Diffusion keeps its own separate shardType.
#
#  Both icon fields are required (MAKING_CUSTOM_QUICKHACKS.md 1.7):
#    icon      TweakDBID pointing at our UIIcon record
#    iconPath  bare CName that resolves to UIIcon.<name>
# =============================================================================

# -----------------------------------------------------------------------------
# Self-Erase - Rare (blue), 60 s
# -----------------------------------------------------------------------------

Items.VH_SelfEraseLvl2Program:
  $base: Items.CovertHack
  displayName: LocKey#990800001
  localizedDescription: LocKey#990800002
  quality: Quality.Rare
  shardType: VH_SelfErase
  icon: UIIcon.VH_SelfEraseIcon
  iconPath: VH_SelfEraseIcon
  hideCooldownUI: True
  hideDurationUI: False
  tags:
    - !append-once Tier2Shard
    - !append-once VH_SelfErase
  OnAttach:
    - EquipmentGLP.UntraceableHack
    - EquipmentGLP.VH_SelfEraseProgram
  objectActions:
    - QuickHack.VH_SelfEraseLvl2Hack
    - DeviceAction.VH_SelfEraseLvl2DeviceHack
    - ItemAction.ProgramDisassemble

